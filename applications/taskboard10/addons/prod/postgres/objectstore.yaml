apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: taskboard10-postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: taskboard10
    app.kubernetes.io/managed-by: gitops-app
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://taskboard10-backups/databases
    endpointURL: http://taskboard10-backups-filer.taskboard10-prod.svc:8333
    s3Credentials:
      accessKeyId:
        name: taskboard10-backups-app
        key: accessKeyId
      secretAccessKey:
        name: taskboard10-backups-app
        key: secretAccessKey
      region:
        name: taskboard10-backups-app
        key: region
    wal:
      compression: gzip
    data:
      compression: gzip
